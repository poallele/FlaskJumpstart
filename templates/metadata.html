{% extends 'base.html' %}

{% block head %}

{% endblock %}

{% block body %}
<div class="content">
    <h1>Metadata</h1>

    <table>
        <tr>
            <th>Date Added (UTC)</th>
            <th>Time Added (UTC)</th>
            <th>Added By</th>
        </tr>
        
        <tr>
            <td>{{ event.date_created.date() }}</td>
            <td>{{ event.date_created.time() }}</td>
            <td>{{ event.added_by }}</td>
        </tr>
    </table>
</div>
{% endblock %}

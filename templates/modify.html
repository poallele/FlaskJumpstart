{% extends 'base.html' %}

{% block head %}

{% endblock %}

{% block body %}
<div class="content">
    <h1>Modify Event</h1>

    <form action="/modify/{{event.id}}" method="POST">
        
        <input
            type="text"
            id="content"

            name="content"
            value={{event.name}}>
        
        <input
            type="text"
            id="content"

            room="content"
            value={{event.room}}>
        
        <input
            type="text"
            id="content"

            date="content"
            value={{event.date}}>
        
        <input
            type="text"
            id="content"
            
            time="content"
            value={{event.time}}>
        
        <input
            type="text"
            id="content"
            
            comment="content"
            value={{event.comment}}>
        
        <input
            type="submit"
            value="Modify All Fields"
            style="color: black">
    </form>
</div>
{% endblock %}

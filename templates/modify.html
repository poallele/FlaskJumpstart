{% extends 'base.html' %}

{% block head %}

{% endblock %}

{% block body %}
<div class="content">
    <h1>Modify Event</h1>

    <form action="/modify/{{event.id}}" method="POST">
        
        <input
            type="text"
            id="content"

            name="name"
            value={{event.name}}>
        
        <input
            type="text"
            id="content"

            name="room"
            value={{event.room}}>
        
        <input
            type="text"
            id="content"

            name="date"
            value={{event.date}}>
        
        <input
            type="text"
            id="content"
            
            name="time"
            value={{event.time}}>
        
        <input
            type="text"
            id="content"
            
            name="comment"
            value={{event.comment}}>
        
        <input
            type="submit"
            value="Modify All Fields"
            style="color: black">
    </form>
</div>
{% endblock %}

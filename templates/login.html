{% extends 'base.html' %}

{% block head %}
<title>Admin Login</title>
{% endblock %}

{% block body %}
<div class="content">
    <h1>Admin Login</h1>

    <form action="/login/" method="POST">
        
        <input
            type="text"
            name="username"
            id="username"
            placeholder="Username"
            required>
        
        <input
            type="password"
            name="password"
            id="password"
            placeholder="Password"
            required>
        
        <input
            type="submit"
            value="Login">

    </form>

    <br>
    <a
        href="/"
        style="text-decoration: none; color: rgb(102, 102, 102)">

        𝗕𝗔𝗖𝗞 𝗧𝗢 𝗘𝗩𝗘𝗡𝗧𝗦
    </a>
</div>
{% endblock %}
